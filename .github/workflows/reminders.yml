name: Check reminders

on:
  schedule:
    # Runs every 15 minutes. GitHub Actions' free tier easily covers this,
    # unlike Vercel's Hobby-plan cron which is capped at once/day.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminders endpoint
        run: |
          curl -sf -X GET "https://sethear.com/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
